name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - chore/project-foundation
      - feat/anilist-data
      - feat/anime-detail
      - feat/chat-api
      - feat/chat-ui
      - docs/repository-guidance
      - chore/final-formatting

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Test
        run: |
          if [ -n "$(git ls-files '*.test.ts' '*.test.tsx' '*.spec.ts' '*.spec.tsx')" ]; then
            bun test
          else
            echo "No test files in this snapshot; skipping."
          fi
      - run: bun run lint
      - run: bunx next typegen
      - run: bunx tsc --noEmit --incremental false
      - run: bun run format:check
      - run: bun run build
